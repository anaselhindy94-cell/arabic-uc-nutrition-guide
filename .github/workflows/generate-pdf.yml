name: Generate PDF

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "index.html"
      - "print-improved.css"
      - "generate-pdf.js"
      - ".github/workflows/generate-pdf.yml"
      - "assets/**"

jobs:
  generate-pdf:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install system dependencies for Chromium
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libnss3 \
            libatk-bridge2.0-0 \
            libatk1.0-0 \
            libcups2 \
            libxkbcommon0 \
            libxcomposite1 \
            libxdamage1 \
            libxrandr2 \
            libgbm1 \
            libasound2t64 \
            libpangocairo-1.0-0 \
            libpango-1.0-0 \
            libcairo2 \
            libgtk-3-0 \
            fonts-noto \
            fonts-noto-color-emoji \
            fonts-noto-core \
            fonts-noto-ui-core

      - name: Install Node dependencies
        run: npm install

      - name: Install Puppeteer Chrome
        run: npx puppeteer browsers install chrome

      - name: Generate PDF with images
        run: node generate-pdf.js

      - name: List generated PDFs
        run: ls -lh *.pdf

      - name: Upload PDF artifact
        uses: actions/upload-artifact@v4
        with:
          name: uc-nutrition-guide-pdf
          path: "*.pdf"
