name: Generate PDF

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  generate-pdf:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Install Chromium dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libnss3 \
            libatk1.0-0 \
            libatk-bridge2.0-0 \
            libcups2 \
            libxcomposite1 \
            libxdamage1 \
            libxrandr2 \
            libgbm1 \
            libasound2t64 \
            libpangocairo-1.0-0 \
            libpango-1.0-0 \
            libgtk-3-0

      - name: Generate full PDF
        run: node generate-pdf.js

      - name: Generate lightweight PDF without images
        run: node generate-pdf.js --no-images

      - name: Upload PDF artifact
        uses: actions/upload-artifact@v4
        with:
          name: arabic-uc-nutrition-guide-pdf
          path: "*.pdf"